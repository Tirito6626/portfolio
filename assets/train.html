<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X/O Trainer</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; text-align: center;
         background: #0f172a; color: #e2e8f0; margin: 0; padding: 12px; min-height: 100vh; }
  h1 { font-size: 20px; margin: 8px 0 2px; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
  #wrap { max-width: 340px; margin: 0 auto; }
  #canvas { background: #fff; border-radius: 14px; touch-action: none;
            cursor: crosshair; display: block; margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,.4); width: 300px; height: 300px; }
  .btns { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
  button { font-family: inherit; font-size: 15px; font-weight: 600; border: none;
           padding: 12px 14px; border-radius: 10px; cursor: pointer; color: #0f172a; }
  button:active { transform: scale(.97); }
  #bx { background: #22d3ee; flex: 1; }
  #bo { background: #fb923c; flex: 1; }
  #bn { background: #94a3b8; flex: 1; }
  .row2 button { background: #334155; color: #e2e8f0; }
  #dl { background: #22c55e; color: #06281a; }
  #guess { font-size: 15px; min-height: 22px; margin: 6px 0; }
  #counts { font-size: 13px; color: #94a3b8; min-height: 18px; margin: 4px 0 10px; }
  #thumbWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #thumb { image-rendering: pixelated; width: 80px; height: 80px;
           border: 2px solid #334155; border-radius: 6px; }
  .hint { font-size: 12px; color: #64748b; }
  a { color: #22d3ee; font-size: 13px; }
  .keys { font-size: 11px; color: #64748b; margin-top: 2px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>X/O Trainer</h1>
  <div class="sub">Zeichne eine Form und tippe an, was es tatsächlich ist. <br>Versuche, pro Kategorie mehr als 50 Beispiele zu sammeln. Lade die Daten herunter, wenn du fertig bist.</div>
  <canvas id="canvas" width="300" height="300"></canvas>
  <div id="guess">Zeiche etwas, um zu starten</div>
  <div class="btns">
    <button id="bx">Es ist X</button>
    <button id="bo">Es ist O</button>
    <button id="bn">Keiner davon</button>
  </div>
  <div class="btns row2">
    <button id="clr">Clear</button>
    <button id="undo">Undo</button>
    <button id="dl">Runterladen</button>
  </div>
  <div id="counts">X: 0 &nbsp; O: 0 &nbsp; kein: 0 &nbsp; (0 total)</div>
  <div id="thumbWrap">
    <canvas id="thumb" width="20" height="20"></canvas>
    <div class="hint">20&times;20 grid the network sees</div>
  </div>
</div>
<script>
  var C = document.getElementById('canvas');
  var X = C.getContext('2d');
  var S = 300, CL = 15;
  var drawing = false, lx = 0, ly = 0;
  var samples = [];

  function clearCanvas() {
    X.fillStyle = '#fff'; X.fillRect(0, 0, S, S);
    var tc = document.getElementById('thumb').getContext('2d');
    tc.clearRect(0, 0, 20, 20);
  }

  function pos(e) {
    var r = C.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (C.width / r.width),
             y: (e.clientY - r.top) * (C.height / r.height) };
  }
  function dot(x, y) {
    X.fillStyle = '#000'; X.beginPath(); X.arc(x, y, 8, 0, 6.283); X.fill();
  }
  function line(x1, y1, x2, y2) {
    X.strokeStyle = '#000'; X.lineWidth = 16; X.lineCap = 'round'; X.lineJoin = 'round';
    X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke();
  }

  C.addEventListener('pointerdown', function(e) {
    e.preventDefault(); drawing = true; var p = pos(e); lx = p.x; ly = p.y; dot(p.x, p.y);
  });
  C.addEventListener('pointermove', function(e) {
    if (!drawing) return; e.preventDefault(); var p = pos(e);
    line(lx, ly, p.x, p.y); lx = p.x; ly = p.y;
  });
  function endDraw() { if (drawing) { drawing = false; } }
  C.addEventListener('pointerup', endDraw);
  C.addEventListener('pointercancel', endDraw);
  C.addEventListener('pointerleave', endDraw);

  function downsample() {
    var d = X.getImageData(0, 0, S, S).data;
    var g = new Array(400);
    for (var r = 0; r < 20; r++) {
      for (var c = 0; c < 20; c++) {
        var s = 0, n = 0;
        for (var y = r * CL; y < (r + 1) * CL; y += 2) {
          for (var x = c * CL; x < (c + 1) * CL; x += 2) {
            s += (255 - d[(y * S + x) * 4]) / 255; n++;
          }
        }
        g[r * 20 + c] = (s / n > 0.30) ? 1 : 0;
      }
    }
    return g;
  }

  function drawThumb(g) {
    var tc = document.getElementById('thumb').getContext('2d');
    for (var i = 0; i < 400; i++) {
      tc.fillStyle = g[i] ? '#000' : '#fff';
      tc.fillRect(i % 20, (i / 20) | 0, 1, 1);
    }
  }

  function classify() {
    var g = downsample();
    drawThumb(g);
    fetch('/classify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(g)
    }).then(function(r) { return r.json(); }).then(function(d) {
      var names = ['X', 'O', 'neither'];
      var cols = ['#22d3ee', '#fb923c', '#94a3b8'];
      var gm = names[d.label] || '?';
      document.getElementById('guess').innerHTML =
        'Model says: <b style="color:' + (cols[d.label] || '#fff') + '">' + gm + '</b>' +
        ' (P(X)=' + (+d.pX).toFixed(2) + ' P(O)=' + (+d.pO).toFixed(2) +
        ' P(N)=' + (+d.pN).toFixed(2) + '). What is it really?';
    }).catch(function(e) {
      document.getElementById('guess').textContent = 'classify err: ' + e;
    });
  }

  function save(label) {
    var g = downsample();
    var black = 0; for (var i = 0; i < 400; i++) black += g[i];
    if (black < 3) { document.getElementById('guess').textContent = 'Canvas ist leer, zeiche etwas zuerst'; return; }
    samples.push({ grid: g, label: label });
    updateCounts();
    clearCanvas();
    document.getElementById('guess').textContent = 'Gespeichert (' + samples.length + ' total).';
  }

  function updateCounts() {
    var cx = 0, co = 0, cn = 0;
    for (var i = 0; i < samples.length; i++) {
      if (samples[i].label === 0) cx++; else if (samples[i].label === 1) co++; else cn++;
    }
    document.getElementById('counts').innerHTML =
      'X: ' + cx + ' &nbsp; O: ' + co + ' &nbsp; neither: ' + cn +
      ' &nbsp; (' + samples.length + ' total)';
  }

  document.getElementById('bx').onclick = function() { save(0); };
  document.getElementById('bo').onclick = function() { save(1); };
  document.getElementById('bn').onclick = function() { save(2); };
  document.getElementById('clr').onclick = function() {
    clearCanvas(); document.getElementById('guess').textContent = 'Sauber. Zeiche etwas.';
  };
  document.getElementById('undo').onclick = function() {
    if (samples.length) { samples.pop(); updateCounts();
      document.getElementById('guess').textContent = 'Undid last (' + samples.length + ' left).'; }
  };
  document.getElementById('dl').onclick = function() {
    if (!samples.length) { document.getElementById('guess').textContent = 'Keine Beispiele soweit. Zeiche etwas.'; return; }
    var data = { format: 'xo-dataset-v1', grid_side: 20, samples: samples };
    var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'xo_dataset.json';
    a.click();
    document.getElementById('guess').textContent = samples.length + ' Beispiele runtergeladen.';
  };

  document.addEventListener('keydown', function(e) {
    if (drawing) return;
    var k = e.key.toLowerCase();
    if (k === 'x') save(0);
    else if (k === 'o') save(1);
    else if (k === 'n') save(2);
    else if (k === 'c') { clearCanvas(); document.getElementById('guess').textContent = 'Sauber.'; }
    else if (k === 'u') {
      if (samples.length) { samples.pop(); updateCounts();
        document.getElementById('guess').textContent = 'Undid last.'; }
    }
  });

  clearCanvas();
</script>
</body>
</html>
